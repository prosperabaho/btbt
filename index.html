<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rover Control</title>
<style>
  :root {
    --bg: #17181a;
    --panel: #1f2123;
    --panel-raised: #26282b;
    --line: #35373a;
    --amber: #ff9a2e;
    --amber-dim: #7a5426;
    --text: #e8e6e1;
    --text-dim: #8b8d90;
    --danger: #e2493a;
    --ok: #4fae6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
  }
  .status-mono {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 16px 28px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header span {
    color: var(--text-dim);
    font-size: 13px;
  }

  .connect-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .dot.connected { background: var(--ok); }
  .connect-bar .info { flex: 1; min-width: 0; }
  .connect-bar .info .line1 { font-size: 14px; }
  .connect-bar .info .line2 {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.connect-btn {
    background: var(--amber);
    color: #1a1400;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.connect-btn:active { opacity: 0.85; }
  button.connect-btn.disconnect {
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  .pad {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    display: grid;
    grid-template-columns: 76px 76px 76px;
    grid-template-rows: 76px 76px 76px;
    gap: 10px;
    justify-content: center;
  }
  .padbtn {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    touch-action: none;
  }
  .padbtn svg { width: 28px; height: 28px; stroke: var(--text); fill: none; }
  .padbtn.active {
    background: var(--amber-dim);
    border-color: var(--amber);
  }
  .padbtn.active svg { stroke: var(--amber); }
  .padbtn.stop { color: var(--danger); font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  .padbtn.stop.active { background: #3a1a16; border-color: var(--danger); }
  .cell-empty { visibility: hidden; }

  .speed-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
  }
  .speed-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .speed-row .label { font-size: 14px; color: var(--text-dim); }
  .speed-row .value { font-size: 20px; font-weight: 600; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--amber);
    border: 3px solid #1a1400;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--amber);
    border: 3px solid #1a1400;
    cursor: pointer;
  }

  .log {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-dim);
    min-height: 20px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: auto;
    padding-top: 6px;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f1ee;
      --panel: #ffffff;
      --panel-raised: #f6f5f2;
      --line: #ddd9d2;
      --text: #1c1c1a;
      --text-dim: #6b6a66;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a; --panel: #1f2123; --panel-raised: #26282b; --line: #35373a;
    --text: #e8e6e1; --text-dim: #8b8d90;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Rover Control</h1>
    <span>HC&#8209;08 &middot; L298N</span>
  </header>

  <div class="connect-bar">
    <div class="dot" id="dot"></div>
    <div class="info">
      <div class="line1" id="statusLine1">Not connected</div>
      <div class="line2 status-mono" id="statusLine2">tap connect to pair</div>
    </div>
    <button class="connect-btn" id="connectBtn">Connect</button>
  </div>

  <div class="pad" id="pad">
    <div class="cell-empty"></div>
    <button class="padbtn" data-cmd="F" aria-label="Forward">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
    <div class="cell-empty"></div>

    <button class="padbtn" data-cmd="L" aria-label="Left">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
    </button>
    <button class="padbtn stop" data-cmd="S" aria-label="Stop">STOP</button>
    <button class="padbtn" data-cmd="R" aria-label="Right">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
    </button>

    <div class="cell-empty"></div>
    <button class="padbtn" data-cmd="B" aria-label="Backward">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
    </button>
    <div class="cell-empty"></div>
  </div>

  <div class="speed-block">
    <div class="speed-row">
      <span class="label">Speed</span>
      <span class="value"><span id="speedValue">7</span>/9</span>
    </div>
    <input type="range" id="speedSlider" min="0" max="9" value="7" step="1">
  </div>

  <div class="log status-mono" id="log">last sent: &mdash;</div>

  <footer>Hold a direction button; release to stop sending. Works in Chrome on Android &mdash; Web Bluetooth isn't available in iOS Safari.</footer>
</div>

<script>
// HM-10/HC-08-style BLE UART service. Most HC-08 clones expose this UUID pair.
// If your specific module uses different UUIDs, check its datasheet and
// update the two constants below.
const SERVICE_UUID = 0xFFE0;
const CHAR_UUID = 0xFFE1;

let device, characteristic;

const dot = document.getElementById('dot');
const statusLine1 = document.getElementById('statusLine1');
const statusLine2 = document.getElementById('statusLine2');
const connectBtn = document.getElementById('connectBtn');
const log = document.getElementById('log');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');

function setLog(msg) {
  log.textContent = 'last sent: ' + msg;
}

function setConnected(isConnected, name) {
  dot.classList.toggle('connected', isConnected);
  if (isConnected) {
    statusLine1.textContent = 'Connected';
    statusLine2.textContent = name || 'HC-05';
    connectBtn.textContent = 'Disconnect';
    connectBtn.classList.add('disconnect');
  } else {
    statusLine1.textContent = 'Not connected';
    statusLine2.textContent = 'tap connect to pair';
    connectBtn.textContent = 'Connect';
    connectBtn.classList.remove('disconnect');
  }
}

async function toggleConnect() {
  if (characteristic) {
    device.gatt.disconnect();
    return;
  }
  if (!navigator.bluetooth) {
    setLog('Web Bluetooth not supported in this browser');
    return;
  }
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);
    setConnected(true, device.name);
  } catch (err) {
    setLog('connect failed: ' + err.message);
    setConnected(false);
  }
}

function onDisconnected() {
  characteristic = null;
  setConnected(false);
}

async function sendCommand(cmd) {
  setLog(cmd);
  if (!characteristic) return;
  try {
    const encoder = new TextEncoder();
    await characteristic.writeValue(encoder.encode(cmd));
  } catch (err) {
    setLog('send failed: ' + err.message);
  }
}

connectBtn.addEventListener('click', toggleConnect);

speedSlider.addEventListener('input', () => {
  speedValue.textContent = speedSlider.value;
  sendCommand(String(speedSlider.value));
});

document.querySelectorAll('.padbtn[data-cmd]').forEach(btn => {
  const cmd = btn.dataset.cmd;
  const isMomentary = cmd !== 'S';

  const press = (e) => {
    e.preventDefault();
    btn.classList.add('active');
    sendCommand(cmd);
  };
  const release = (e) => {
    e.preventDefault();
    btn.classList.remove('active');
    if (isMomentary) sendCommand('S');
  };

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
});
</script>
</body>
</html>
